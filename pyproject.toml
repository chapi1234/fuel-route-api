[project]
name = "fuel-route-api"
version = "0.1.0"
description = "Plan a US road trip and the cheapest fuel stops along it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "httpx>=0.28",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]
ignore = ["SIM905"]
